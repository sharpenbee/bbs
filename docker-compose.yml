version: '3.8'

# 如果遇到镜像拉取问题，请参考以下解决方案：
# 1. 配置Docker镜像加速器（推荐）
# 2. 使用备选Dockerfile（Dockerfile.alt）使用更常见的镜像
# 3. 手动拉取镜像后再构建

services:
  mysql:
    # 如果无法拉取mysql:8.0，可以尝试使用mariadb:10.11作为替代
    image: mysql:8.0
    # image: mariadb:10.11
    container_name: bbs-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: bbs-jdk21
      MYSQL_CHARACTER_SET_SERVER: utf8mb4
      MYSQL_COLLATION_SERVER: utf8mb4_unicode_ci
      # 如果使用mariadb，需要添加以下环境变量
      # MARIADB_ROOT_PASSWORD: root
      # MARIADB_DATABASE: bbs-jdk21
      # MARIADB_CHARACTER_SET_SERVER: utf8mb4
      # MARIADB_COLLATION_SERVER: utf8mb4_unicode_ci
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./docker/mysql/init:/docker-entrypoint-initdb.d
    networks:
      - bbs-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: bbs-redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - bbs-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
      # 如果无法拉取eclipse-temurin镜像，可以使用备选Dockerfile
      # dockerfile: Dockerfile.alt
    container_name: bbs-app
    restart: always
    ports:
      - "8080:8080"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      - SPRING_DATASOURCE_URL=jdbc:mysql://mysql:3306/bbs-jdk21?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&zeroDateTimeBehavior=CONVERT_TO_NULL&allowPublicKeyRetrieval=true&useSSL=false&rewriteBatchedStatements=true
      - SPRING_DATASOURCE_USERNAME=root
      - SPRING_DATASOURCE_PASSWORD=root
      - SPRING_DATA_REDIS_HOST=redis
      - SPRING_DATA_REDIS_PORT=6379
      - JAVA_OPTS=-Xms256m -Xmx512m
    volumes:
      - app_data:/app/bbs
      - ./logs:/app/logs
    networks:
      - bbs-network

volumes:
  mysql_data:
  redis_data:
  app_data:

networks:
  bbs-network:
    driver: bridge
